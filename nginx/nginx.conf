events {
    worker_connections 1024;
}

http {
    upstream rent_backend {
    least_conn;
        server api1:8000 max_fails=2 fail_timeout=5s;
        server api2:8000 max_fails=2 fail_timeout=5s;
        server api3:8000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://rent_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Автоматичний перехід на здоровий сервер при помилці
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}