version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rent_db
    restart: always
    environment:
      POSTGRES_USER: rent_user
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: rent_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rent_user -d rent_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rent_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      DATABASE_URL: postgresql://rent_user:supersecretpassword@db:5432/rent_database
      SECRET_KEY: my-very-secret-key-12345
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ALGORITHM: HS256
    # Це налаштування для Hot-Reload, з твоєї папки src прокидається прямо в контейнер
    volumes:
      - ./src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: