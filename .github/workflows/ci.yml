name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Завантаження коду репозиторію
      uses: actions/checkout@v4

    - name: Налаштування Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Встановлення залежностей
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest httpx
        pip install bcrypt==3.2.2 passlib
        pip install -r requirements.txt

    - name: Перевірка коду лінтером (flake8)
      run: |
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

    - name: Запуск тестів (pytest)
      env:
        ENVIRONMENT: sandbox
        DEBUG: True
        DATABASE_URL: sqlite:///./rent_db_sandbox.sqlite3
        SECRET_KEY: super-secret-github-key
      run: |
        pytest tests/